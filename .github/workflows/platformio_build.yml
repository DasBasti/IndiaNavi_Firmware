name: Build device binaries using platform.io

on:
  workflow_call:
  
jobs:
  platformio_run:
    strategy:
      matrix:
        target: [indianavi_s3_n16r8_debug, indianavi_s3_n16r8_release]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        # the version in the firmware comes from git describe, it needs the tags
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' 

    - name: Set up Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio

    - name: Install pio and its dependencies
      run: |
        python -m pip install --upgrade pip
        pip install platformio esptool==4.11.0

    - name: Run PlatformIO build on embedded platforms
      run: platformio run -e ${{ matrix.target }}

    # the application for an update over Bluetooth or WiFi, and the complete flash image for USB at offset 0x0.
    # The offsets are the ones of partitions_16M.csv.
    - name: Create the flash image
      run: |
        build=.pio/build/${{ matrix.target }}
        mkdir -p out
        cp $build/firmware.bin out/indianavi.bin
        esptool.py --chip esp32s3 merge_bin -o out/indianavi-full.bin \
          --flash_mode keep --flash_freq keep --flash_size keep \
          0x0 $build/bootloader.bin 0x8000 $build/partitions.bin \
          0xe000 $build/ota_data_initial.bin 0x10000 $build/firmware.bin

    - name: Upload firmware binaries
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: firmware_${{ matrix.target }}
        path: out/
        retention-days: 5

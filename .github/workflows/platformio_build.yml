name: Build device binaries using platform.io

on:
  workflow_call:
  
jobs:
  platformio_run:
    strategy:
      matrix:
        target: [indianavi_s3_n16r8_debug, indianavi_s3_n16r8_release]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' 

    - name: Set up Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio

    - name: Install pio and its dependencies
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Run PlatformIO build on embedded platforms
      run: platformio run -e ${{ matrix.target }}

    - name: Upload firmware binary
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: firmware_${{ matrix.target }}.bin
        path: .pio/build/${{ matrix.target }}/firmware.bin
        retention-days: 5

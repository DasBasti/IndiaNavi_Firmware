# The firmware binary. NOT a member of ../Cargo.toml: it can only be built
# with the Xtensa/ESP-IDF toolchain (see rust-toolchain.toml and
# .cargo/config.toml next to this file, and PORTING.md one level up).
#
# MERGE NOTE (tsk_01M3HGZ54NYHZJ85XPSBJJYX7T)
# -------------------------------------------
# This branch was cut from a `main` that has no `rust/` directory at all: the
# workspace scaffold PR (#68) and every library-crate PR are still unmerged.
# Two deliberate differences from the scaffold's version of this file, both of
# which the person merging has to look at:
#
#  1. The ten `pm-*` / driver path dependencies are commented out below. They
#     do not exist on this branch, and cargo refuses to parse a manifest that
#     names a missing path dependency (even an optional one). RESTORE THEM
#     verbatim from the scaffold once the crates land; nothing in
#     `src/runtime/` uses them yet.
#  2. `esp-idf-svc` / `esp-idf-hal` moved from the unconditional
#     `[dependencies]` into a
#     `[target.'cfg(target_os = "espidf")'.dependencies]` section. KEEP THIS.
#     It is what lets `cargo test --target x86_64-unknown-linux-gnu` run the
#     host tests in `src/runtime/` without an ESP-IDF install, which
#     PORTING.md's "Firmware build" section says is otherwise impossible. The
#     ESP build is unaffected: `target_os = "espidf"` holds for both
#     `xtensa-esp32s3-espidf` and `xtensa-esp32-espidf`.
#
# Three scaffold files are deliberately NOT recreated here, so they merge in
# untouched: `.cargo/config.toml`, `rust-toolchain.toml` and `Cargo.lock`.
# Adding them would have made this branch unbuildable on its own --
# `rust-toolchain.toml` asks for the `esp` channel, and `.cargo/config.toml`
# pins `xtensa-esp32s3-espidf` as the default target. Once they land,
# the host test run needs the target spelled out:
#     cargo test --target x86_64-unknown-linux-gnu

[package]
name = "indianavi-firmware"
description = "IndiaNavi firmware binary (ESP-IDF)"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/platinenmacher/IndiaNavi"
authors = ["Bastian Neumann <info@platinenmacher.tech>"]

[[bin]]
name = "indianavi"
path = "src/main.rs"

[features]
# Primary board: indianavi-s3-n16r8 / ESP32-S3. Matches the platformio
# env:indianavi_s3_n16r8_* (-DESP_S3).
default = ["board-esp32s3"]
board-esp32s3 = []
# Secondary board: the original REV2 ESP32. Matches env:esp32dev_*.
# Same application code, different pin map and flash layout.
board-esp32 = []

[dependencies]
log = "0.4"

# The ported libraries. Paths, not workspace deps: this crate is outside the
# ../Cargo.toml workspace. See MERGE NOTE 1 above -- uncomment when the crates
# exist.
# pm-core = { path = "../crates/pm-core" }
# pm-font = { path = "../crates/pm-font" }
# pm-icons = { path = "../crates/pm-icons" }
# pm-gui = { path = "../crates/pm-gui" }
# pm-parser = { path = "../crates/pm-parser" }
# nmea = { path = "../crates/nmea" }
# gpx = { path = "../crates/gpx" }
# lsm303 = { path = "../crates/lsm303" }
# acep-5in65-7c = { path = "../crates/acep-5in65-7c" }
# pm-qr = { path = "../crates/pm-qr" }

# ESP-IDF (std) rather than bare-metal esp-hal -- see PORTING.md "Runtime".
# UNVERIFIED in this container (no host C compiler for esp-idf-sys, no
# python3/cmake/ninja), exactly as the scaffold flagged. See MERGE NOTE 2.
[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = "0.53"
esp-idf-hal = "0.47"

[build-dependencies]
# Unconditional, as in the scaffold: `espidf::sysenv::output()` is a no-op
# when the ESP-IDF sysenv variables are absent, so it costs a host build
# nothing but a compile of `embuild` itself.
embuild = { version = "0.33", features = ["espidf"] }

[profile.release]
opt-level = "s"

[profile.dev]
opt-level = "z"
debug = true
